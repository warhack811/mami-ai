name: Mami AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Tests
      run: |
        cd backend
        pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
    - uses: actions/checkout@v3

    - name: Build Backend Image
      run: docker build -t mami-backend ./backend

    - name: Build Frontend Image
      run: docker build -t mami-frontend ./frontend
