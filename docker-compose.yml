version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mami-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mami-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: mami-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mami_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mami_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mami_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.15-community
    container_name: mami-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mami_graph_pass}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: mami-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: mami-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mami-celery-worker
    command: celery -A app.worker.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  chroma_data:
